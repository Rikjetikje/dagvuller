<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎪 Circus Volleybal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a0a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Georgia', serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    h1 {
      color: #ffd700;
      font-size: clamp(1rem, 4vw, 2rem);
      text-shadow: 0 0 20px #ff6600, 2px 2px 0 #cc0000;
      margin-bottom: 6px;
      letter-spacing: 3px;
    }
    #canvasWrapper { width: 100%; max-width: 800px; }
    #gameCanvas {
      border: 3px solid #ffd700;
      border-radius: 4px;
      box-shadow: 0 0 30px #ff6600aa;
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
    }
    #hint {
      color: #ffcc8888;
      font-size: clamp(0.55rem, 2vw, 0.75rem);
      margin-top: 6px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🎪 CIRCUS VOLLEYBAL 🎪</h1>
  <div id="canvasWrapper">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
  </div>
  <div id="hint">📱 Sleep om te bewegen · loslaten = springen · tik om te serven</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const W = canvas.width, H = canvas.height;
    const GROUND   = H - 60;
    const NET_X    = W / 2;
    const NET_H    = 110;
    const NET_TOP  = GROUND - NET_H;
    const GRAVITY  = 0.45;
    const P_SPEED  = 4.5;
    const JUMP_V   = -11;
    const BALL_R   = 18;
    const P_R      = 28;
    const WIN      = 7;

    let gameMode = 'menu';

    const state = {
      score:   [0, 0],
      winner:  null,
      phase:   'serving',
      server:  0,
      ball:    null,
      players: [{}, {}],
    };

    let confetti = [];
    let aiTimer  = 0;

    function resetGame() {
      state.score  = [0, 0];
      state.winner = null;
      confetti     = [];
      beginServe(0);
    }

    function beginServe(serverIdx) {
      state.phase  = 'serving';
      state.server = serverIdx;
      aiTimer      = 80;
      state.players[0] = { x: W * 0.2, y: GROUND, vy: 0, onGround: true, face: 1 };
      state.players[1] = { x: W * 0.8, y: GROUND, vy: 0, onGround: true, face: -1 };
      const sx = serverIdx === 0 ? W * 0.25 : W * 0.75;
      state.ball = { x: sx, y: GROUND - 160, vx: 0, vy: 0, angle: 0 };
    }

    function launchBall(serverIdx) {
      if (state.phase !== 'serving' || state.server !== serverIdx) return;
      state.phase   = 'playing';
      state.ball.vx = serverIdx === 0 ? 4 : -4;
      state.ball.vy = -9;
    }

    // ── Touch ─────────────────────────────────────────────────────
    const touch = [
      { active: false, id: -1, x: 0, released: false },
      { active: false, id: -1, x: 0, released: false },
    ];

    function cX(clientX) {
      const r = canvas.getBoundingClientRect();
      return (clientX - r.left) * (W / r.width);
    }
    function cY(clientY) {
      const r = canvas.getBoundingClientRect();
      return (clientY - r.top) * (H / r.height);
    }

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        const x = cX(t.clientX), y = cY(t.clientY);
        if (gameMode === 'menu')            { handleMenuTap(x, y); continue; }
        if (state.winner !== null)          { resetGame();          continue; }
        const idx = x < W / 2 ? 0 : 1;
        if (gameMode === '1p' && idx === 1) continue;
        if (!touch[idx].active) {
          touch[idx] = { active: true, id: t.identifier, x, released: false };
        }
        if (state.phase === 'serving') launchBall(idx);
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        for (const td of touch) {
          if (td.active && td.id === t.identifier) td.x = cX(t.clientX);
        }
      }
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        for (const td of touch) {
          if (td.active && td.id === t.identifier) {
            td.active   = false;
            td.released = true;
          }
        }
      }
    }, { passive: false });

    canvas.addEventListener('touchcancel', e => {
      for (const t of e.changedTouches) {
        for (const td of touch) {
          if (td.active && td.id === t.identifier) td.active = false;
        }
      }
    });

    // ── Keyboard ──────────────────────────────────────────────────
    const keys = {};
    document.addEventListener('keydown', e => {
      if (keys[e.key]) return;
      keys[e.key] = true;
      if (e.key === 'Enter') { gameMode = 'menu'; return; }
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
      if (state.phase === 'serving') {
        if (e.key === 'w' || e.key === 'W') launchBall(0);
        if (e.key === 'ArrowUp')            launchBall(1);
      }
    });
    document.addEventListener('keyup', e => { keys[e.key] = false; });

    canvas.addEventListener('click', e => {
      if (gameMode !== 'menu') return;
      const r = canvas.getBoundingClientRect();
      handleMenuTap((e.clientX-r.left)*(W/r.width), (e.clientY-r.top)*(H/r.height));
    });

    const BTN = {
      oneP: { x: W/2-160, y: H/2-10, w: 140, h: 54 },
      twoP: { x: W/2+20,  y: H/2-10, w: 140, h: 54 },
    };
    function inBtn(b,x,y){return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}
    function handleMenuTap(x,y){
      if(inBtn(BTN.oneP,x,y)){gameMode='1p';resetGame();}
      if(inBtn(BTN.twoP,x,y)){gameMode='2p';resetGame();}
    }

    // ── AI ────────────────────────────────────────────────────────
    const ai = { targetX: W*0.8, wantsJump: false, frameCount: 0 };

    function updateAI() {
      const b = state.ball, p = state.players[1];
      if (state.phase === 'serving' && state.server === 1) {
        if (--aiTimer <= 0) launchBall(1);
        return;
      }
      if (state.phase !== 'playing') return;
      if (++ai.frameCount < 5) return;
      ai.frameCount = 0;

      let bx=b.x,by=b.y,bvx=b.vx,bvy=b.vy;
      for(let i=0;i<50;i++){
        bvy+=GRAVITY*0.85;bx+=bvx;by+=bvy;
        if(bx<BALL_R){bx=BALL_R;bvx=Math.abs(bvx);}
        if(bx>W-BALL_R){bx=W-BALL_R;bvx=-Math.abs(bvx);}
        if(by+BALL_R>=GROUND)break;
        if(by+BALL_R>NET_TOP){
          const nl=NET_X-30,nr=NET_X+30;
          if(bx+BALL_R>nl&&bx-BALL_R<nr)bvx=bx<NET_X?-Math.abs(bvx):Math.abs(bvx);
        }
      }
      ai.targetX=(b.x>NET_X||b.vx>0)?Math.max(NET_X+40,Math.min(W-P_R,bx)):W*0.75;
      const dist=Math.hypot(b.x-p.x,b.y-(p.y-P_R));
      ai.wantsJump=b.x>NET_X&&b.vy>-2&&b.y>GROUND-260&&b.y<GROUND-20&&dist<160;
    }

    function applyAI(p){
      const dx=ai.targetX-p.x;
      if(dx<-4){p.x-=P_SPEED*0.9;p.face=-1;}
      else if(dx>4){p.x+=P_SPEED*0.9;p.face=1;}
      if(ai.wantsJump&&p.onGround){p.vy=JUMP_V;p.onGround=false;ai.wantsJump=false;}
    }

    // ── Physics ───────────────────────────────────────────────────
    function updatePhysics(){
      if(gameMode==='menu'||state.winner!==null)return;
      if(gameMode==='1p')updateAI();

      if(state.phase==='serving'){
        state.ball.x=state.server===0?W*0.25:W*0.75;
        state.ball.y=GROUND-160+Math.sin(Date.now()/350)*6;
        state.ball.angle+=0.015;
        movePlayers(true);
        return;
      }

      movePlayers(false);

      const b=state.ball;
      b.vy+=GRAVITY*0.85;b.x+=b.vx;b.y+=b.vy;b.angle+=b.vx*0.05;
      if(b.x-BALL_R<0){b.x=BALL_R;b.vx=Math.abs(b.vx)*0.8;}
      if(b.x+BALL_R>W){b.x=W-BALL_R;b.vx=-Math.abs(b.vx)*0.8;}
      if(b.y-BALL_R<30){b.y=30+BALL_R;b.vy=Math.abs(b.vy)*0.7;}

      if(b.y+BALL_R>NET_TOP&&b.y-BALL_R<GROUND){
        const nl=NET_X-30,nr=NET_X+30;
        if(b.x+BALL_R>nl&&b.x-BALL_R<nr){
          if(b.x<NET_X){b.x=nl-BALL_R;b.vx=-Math.abs(b.vx);}
          else{b.x=nr+BALL_R;b.vx=Math.abs(b.vx);}
        }
      }

      if(b.y+BALL_R>=GROUND){
        const scorer=b.x<NET_X?1:0;
        state.score[scorer]++;
        if(state.score[scorer]>=WIN){state.winner=scorer;spawnConfetti();}
        else beginServe(scorer);
        return;
      }

      for(let i=0;i<2;i++){
        const p=state.players[i];
        const px=p.x,py=p.y-P_R*0.7;
        const dx=b.x-px,dy=b.y-py;
        const dist=Math.sqrt(dx*dx+dy*dy);
        const minD=BALL_R+P_R*0.9;
        if(dist<minD&&dist>0){
          const nx=dx/dist,ny=dy/dist;
          b.x=px+nx*minD;b.y=py+ny*minD;
          const dot=b.vx*nx+b.vy*ny;
          b.vx=(b.vx-2*dot*nx)*0.9;
          b.vy=(b.vy-2*dot*ny)*0.9-3;
          b.vx=Math.max(-14,Math.min(14,b.vx));
          b.vy=Math.max(-14,Math.min(14,b.vy));
        }
      }
    }

    function movePlayers(servingPhase){
      for(let idx=0;idx<2;idx++){
        const p=state.players[idx];
        const td=touch[idx];
        const isAI=gameMode==='1p'&&idx===1;

        if(isAI){
          if(!servingPhase)applyAI(p);
        }else{
          // Touch: player follows finger directly
          if(td.active){
            const minX=idx===0?P_R:NET_X+40;
            const maxX=idx===0?NET_X-40:W-P_R;
            const newX=Math.max(minX,Math.min(maxX,td.x));
            if(newX>p.x+1)p.face=1;
            else if(newX<p.x-1)p.face=-1;
            p.x=newX;
          }
          if(td.released){
            td.released=false;
            if(p.onGround&&!servingPhase){p.vy=JUMP_V;p.onGround=false;}
          }
          // Keyboard (only when not using touch)
          const[left,right,jump]=idx===0?['a','d','w']:['ArrowLeft','ArrowRight','ArrowUp'];
          if(!td.active){
            if(keys[left]){p.x-=P_SPEED;p.face=-1;}
            if(keys[right]){p.x+=P_SPEED;p.face=1;}
          }
          if(keys[jump]&&p.onGround&&!servingPhase){p.vy=JUMP_V;p.onGround=false;}
        }

        p.vy+=GRAVITY;p.y+=p.vy;
        if(p.y>=GROUND){p.y=GROUND;p.vy=0;p.onGround=true;}
        const minX=idx===0?P_R:NET_X+40;
        const maxX=idx===0?NET_X-40:W-P_R;
        p.x=Math.max(minX,Math.min(maxX,p.x));
      }
    }

    function spawnConfetti(){
      for(let i=0;i<120;i++){
        confetti.push({
          x:Math.random()*W,y:Math.random()*-H,
          vx:(Math.random()-0.5)*3,vy:Math.random()*3+1,
          color:['#ff0','#f0f','#0ff','#f60','#0f0','#fff'][Math.floor(Math.random()*6)],
          size:Math.random()*8+4,rot:Math.random()*Math.PI*2,rotV:(Math.random()-0.5)*0.2,
        });
      }
    }
    function updateConfetti(){
      for(const p of confetti){p.x+=p.vx;p.y+=p.vy;p.rot+=p.rotV;if(p.y>H+20)p.y=-10;}
    }

    // ── Drawing ───────────────────────────────────────────────────
    function drawBg(){
      ctx.fillStyle='#1a0a2e';ctx.fillRect(0,0,W,H);
      const sc=['#cc0000','#ffffff','#ffd700'];
      for(let i=0;i<Math.ceil(W/50);i++){ctx.fillStyle=sc[i%sc.length];ctx.fillRect(i*50,0,50,30);}
      ctx.fillStyle='#8B0000';ctx.fillRect(0,28,W,4);
      const grd=ctx.createLinearGradient(0,GROUND-10,0,H);
      grd.addColorStop(0,'#8B4513');grd.addColorStop(1,'#5C2D0A');
      ctx.fillStyle=grd;ctx.fillRect(0,GROUND,W,H-GROUND);
      ctx.strokeStyle='#a0522d44';ctx.lineWidth=1;
      for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(0,GROUND+i*8);ctx.lineTo(W,GROUND+i*8);ctx.stroke();}
      ctx.fillStyle='#ffffff88';
      for(let i=0;i<30;i++){ctx.beginPath();ctx.arc((i*137+50)%(W-20)+10,(i*97+40)%(GROUND-40)+10,1.5,0,Math.PI*2);ctx.fill();}
      [W*0.25,W*0.75].forEach((cx,i)=>{
        const g=ctx.createRadialGradient(cx,30,10,cx,GROUND,200);
        g.addColorStop(0,i===0?'#ffffff22':'#ffaa0022');g.addColorStop(1,'transparent');
        ctx.fillStyle=g;ctx.fillRect(cx-200,0,400,GROUND);
      });
      ctx.strokeStyle='#ffffff11';ctx.lineWidth=1;ctx.setLineDash([6,8]);
      ctx.beginPath();ctx.moveTo(W/2,34);ctx.lineTo(W/2,GROUND);ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawNet(){
      ctx.fillStyle='#ffd700';ctx.fillRect(NET_X-5,NET_TOP-10,10,NET_H+10);
      ctx.strokeStyle='#ffffffcc';ctx.lineWidth=1.5;
      const nw=60,nh=NET_H,cols=8,rows=6;
      for(let c=0;c<=cols;c++){ctx.beginPath();ctx.moveTo(NET_X-nw/2+c*(nw/cols),NET_TOP);ctx.lineTo(NET_X-nw/2+c*(nw/cols),NET_TOP+nh);ctx.stroke();}
      for(let r=0;r<=rows;r++){ctx.beginPath();ctx.moveTo(NET_X-nw/2,NET_TOP+r*(nh/rows));ctx.lineTo(NET_X+nw/2,NET_TOP+r*(nh/rows));ctx.stroke();}
      ctx.fillStyle='#cc0000';ctx.fillRect(NET_X-nw/2,NET_TOP-4,nw,8);
    }

    function drawBall(){
      const b=state.ball;
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle);
      ctx.fillStyle='rgba(0,0,0,0.3)';
      ctx.beginPath();ctx.ellipse(0,GROUND-b.y+4,BALL_R*0.8,6,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(0,0,BALL_R,0,Math.PI*2);
      const g=ctx.createRadialGradient(-5,-5,2,0,0,BALL_R);
      g.addColorStop(0,'#ffee88');g.addColorStop(0.5,'#ff6600');g.addColorStop(1,'#cc2200');
      ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle='#ffd700';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(-BALL_R,0);ctx.lineTo(BALL_R,0);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,-BALL_R);ctx.lineTo(0,BALL_R);ctx.stroke();
      drawStar(0,0,5,6,3,'#ffd700');
      ctx.restore();
    }

    function drawStar(cx,cy,spikes,outerR,innerR,color){
      ctx.save();ctx.fillStyle=color;ctx.beginPath();
      let rot=(Math.PI/2)*3;const step=Math.PI/spikes;
      ctx.moveTo(cx,cy-outerR);
      for(let i=0;i<spikes;i++){
        ctx.lineTo(cx+Math.cos(rot)*outerR,cy+Math.sin(rot)*outerR);rot+=step;
        ctx.lineTo(cx+Math.cos(rot)*innerR,cy+Math.sin(rot)*innerR);rot+=step;
      }
      ctx.closePath();ctx.fill();ctx.restore();
    }

    function drawPlayer(p,idx){
      const C=[{body:'#cc0000',hat:'#8B0000',det:'#ffd700'},{body:'#0044cc',hat:'#002288',det:'#ff6600'}];
      const c=C[idx],d=p.face;
      ctx.save();ctx.translate(p.x,p.y);
      ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.ellipse(0,2,P_R*0.8,7,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=c.body;ctx.beginPath();ctx.ellipse(0,-P_R*0.5,P_R*0.7,P_R*0.8,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=c.det;
      for(let i=-1;i<=1;i++){ctx.beginPath();ctx.arc(i*12,-P_R*0.4,4,0,Math.PI*2);ctx.fill();}
      ctx.fillStyle='#f5c9a0';ctx.beginPath();ctx.arc(0,-P_R*1.45,P_R*0.55,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ff2222';ctx.beginPath();ctx.arc(d*5,-P_R*1.4,6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#222';
      ctx.beginPath();ctx.arc(d*8-d*14,-P_R*1.55,3,0,Math.PI*2);ctx.fill();
      ctx.arc(d*8,-P_R*1.55,3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(d*8-d*14+1,-P_R*1.58,1.2,0,Math.PI*2);ctx.fill();
      ctx.arc(d*8+1,-P_R*1.58,1.2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=c.hat;ctx.fillRect(-14,-P_R*2.15,28,22);ctx.fillRect(-18,-P_R*1.95,36,6);
      ctx.fillStyle=c.det;ctx.fillRect(-14,-P_R*2.0,28,5);
      ctx.strokeStyle=c.body;ctx.lineWidth=8;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(d*18,-P_R*0.6);ctx.lineTo(d*30,-P_R*1.2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-d*18,-P_R*0.6);ctx.lineTo(-d*28,-P_R*0.1);ctx.stroke();
      ctx.strokeStyle=c.body;ctx.lineWidth=10;
      ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(-14,20);ctx.stroke();
      ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(14,20);ctx.stroke();
      ctx.fillStyle='#222';
      ctx.beginPath();ctx.ellipse(-14,22,16,7,-0.2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(14,22,16,7,0.2,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }

    function drawServeHint(){
      if(state.phase!=='serving')return;
      if(gameMode==='1p'&&state.server===1)return;
      ctx.save();
      ctx.textAlign='center';ctx.font='bold 14px Georgia';
      ctx.fillStyle='#ffd700cc';ctx.shadowColor='#ff6600';ctx.shadowBlur=8;
      ctx.fillText('▶ tik om te serven',state.ball.x,state.ball.y-BALL_R-14);
      ctx.restore();
    }

    function drawScore(){
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,0.5)';ctx.roundRect(W/2-100,35,200,50,10);ctx.fill();
      ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.roundRect(W/2-100,35,200,50,10);ctx.stroke();
      ctx.font='bold 28px Georgia';ctx.textAlign='center';
      ctx.fillStyle='#cc0000';ctx.fillText(state.score[0],W/2-40,68);
      ctx.fillStyle='#aaa';ctx.fillText('-',W/2,68);
      ctx.fillStyle='#0044cc';ctx.fillText(state.score[1],W/2+40,68);
      ctx.font='12px Georgia';ctx.fillStyle='#ffcc88';
      ctx.fillText('P1',W/2-40,42);
      ctx.fillText(gameMode==='1p'?'🤖':'P2',W/2+40,42);
      ctx.restore();
    }

    function drawWin(){
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';ctx.font='bold 48px Georgia';
      ctx.fillStyle='#ffd700';ctx.shadowColor='#ff6600';ctx.shadowBlur=20;
      const who=state.winner===0?'🎪 Speler 1 Wint!':gameMode==='1p'?'🤖 Computer Wint!':'🎪 Speler 2 Wint!';
      ctx.fillText(who,W/2,H/2-20);
      ctx.font='20px Georgia';ctx.fillStyle='#ffcc88';ctx.shadowBlur=0;
      ctx.fillText('Tik of ENTER voor menu',W/2,H/2+30);
      ctx.restore();
    }

    function drawConfetti(){
      for(const p of confetti){
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
        ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);ctx.restore();
      }
    }

    function drawMenu(){
      drawBg();
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,0.65)';ctx.roundRect(W/2-220,H/2-130,440,220,16);ctx.fill();
      ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.roundRect(W/2-220,H/2-130,440,220,16);ctx.stroke();
      ctx.textAlign='center';ctx.font='bold 30px Georgia';ctx.fillStyle='#ffd700';
      ctx.shadowColor='#ff6600';ctx.shadowBlur=12;
      ctx.fillText('Kies een modus',W/2,H/2-55);ctx.shadowBlur=0;
      menuBtn(BTN.oneP,'🤖 1 Speler','#cc0000');
      menuBtn(BTN.twoP,'👥 2 Spelers','#0044cc');
      ctx.font='13px Georgia';ctx.fillStyle='#ffcc8888';
      ctx.fillText('Tik of klik om te kiezen',W/2,H/2+90);
      ctx.restore();
    }

    function menuBtn(b,label,color){
      ctx.save();
      ctx.fillStyle=color;ctx.shadowColor=color+'88';ctx.shadowBlur=10;
      ctx.roundRect(b.x,b.y,b.w,b.h,10);ctx.fill();
      ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.shadowBlur=0;
      ctx.roundRect(b.x,b.y,b.w,b.h,10);ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='bold 17px Georgia';ctx.textAlign='center';
      ctx.fillText(label,b.x+b.w/2,b.y+b.h/2+6);
      ctx.restore();
    }

    function loop(){
      updatePhysics();updateConfetti();
      if(gameMode==='menu'){drawMenu();}
      else{
        drawBg();drawNet();drawBall();
        drawPlayer(state.players[0],0);drawPlayer(state.players[1],1);
        drawServeHint();drawScore();drawConfetti();
        if(state.winner!==null)drawWin();
      }
      requestAnimationFrame(loop);
    }

    resetGame();
    loop();
  </script>
</body>
</html>
